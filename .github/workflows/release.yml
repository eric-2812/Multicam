name: Release (Windows)

# Publishes a NEW release for the version in package.json, with the notes from its CHANGELOG.md
# section. Run it by hand from the Actions tab (or push a matching v* tag). It refuses to
# publish a version that already has a release: bump the version for every change.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Work out the version and its release notes
        id: info
        run: node scripts/release-info.mjs

      - name: Stop if this version was already released
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.info.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "::error::$TAG is already released. Bump \"version\" in package.json and add a CHANGELOG.md section."
            exit 1
          fi

      - run: npm ci
      - run: npm run build
      - name: Build installer and portable .exe
        run: npx electron-builder --win --publish never
        env:
          # No code-signing certificate yet: Windows will show "unknown publisher" on first run.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Publish release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ steps.info.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.info.outputs.name }}
          body_path: release-notes.md
          prerelease: true
          make_latest: true
          files: |
            release/Cortiva-Setup-*.exe
            release/Cortiva-*-portable.exe
