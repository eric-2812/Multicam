name: Release (Windows)

# Publishes a NEW release for the version in package.json, with the notes from its CHANGELOG.md
# section, then puts the same version on the website (GitHub Pages), so the web and the .exe
# are always the same release. Run it by hand from the Actions tab (or push a matching v* tag).
# It refuses to publish a version that already has a release: bump the version for every change.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Work out the version and its release notes
        id: info
        run: node scripts/release-info.mjs

      - name: Stop if this version was already released
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.info.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "::error::$TAG is already released. Bump \"version\" in package.json and add a CHANGELOG.md section."
            exit 1
          fi

      - run: npm ci
      - run: npm run build
      - name: Build installer and portable .exe
        run: npx electron-builder --win --publish never
        env:
          # No code-signing certificate yet: Windows will show "unknown publisher" on first run.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Make the update file available under both channel names
        shell: bash
        run: |
          # Installed copies look for latest.yml or beta.yml depending on their version.
          [ -f release/beta.yml ] && [ ! -f release/latest.yml ] && cp release/beta.yml release/latest.yml
          [ -f release/latest.yml ] && [ ! -f release/beta.yml ] && cp release/latest.yml release/beta.yml
          ls release/*.yml

      - name: Publish release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ steps.info.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.info.outputs.name }}
          body_path: release-notes.md
          prerelease: false
          make_latest: true
          # The .yml and .blockmap files let installed copies update themselves.
          files: |
            release/Cortiva-Setup-*.exe
            release/Cortiva-*-portable.exe
            release/Cortiva-Setup-*.exe.blockmap
            release/latest.yml
            release/beta.yml

  # The website is updated only by a release, from the same commit, once the .exe files are out.
  web:
    needs: windows
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: touch dist/.nojekyll
      - uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
