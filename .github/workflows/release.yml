name: Release (Windows)

# Publishes a NEW release for the version in package.json, with the notes from its CHANGELOG.md
# section. Run it by hand from the Actions tab (or push a matching v* tag). It refuses to
# publish a version that already has a release: bump the version for every change.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Work out the version and its release notes
        id: info
        run: node scripts/release-info.mjs

      - name: Stop if this version was already released
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ steps.info.outputs.tag }}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "::error::${{ steps.info.outputs.tag }} is already released. Bump \"version\" in package.json and add a CHANGELOG.md section."
            exit 1
          fi

      - run: npm ci
      - run: npm run build
      - name: Build installer and portable .exe
        run: npx electron-builder --win --publish never
        env:
          # No code-signing certificate yet: Windows will show "unknown publisher" on first run.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.info.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.info.outputs.name }}
          body_path: release-notes.md
          prerelease: true
          make_latest: true
          files: |
            release/Cortiva-Setup-*.exe
            release/Cortiva-*-portable.exe
